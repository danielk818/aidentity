<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="rename: before, rm -rf in place leaves a hollow bundle; after, the old launcher is moved aside first">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1F2430; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
    .dim { fill: #6B7280; font-size: 12px; }
    .bad { fill: #E5484D; }
    .good { fill: #2FB344; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .boxbad { fill: #fff5f5; stroke: #E5484D; }
    .boxgood { fill: #f0fbf2; stroke: #2FB344; }
    .strike { text-decoration: line-through; fill: #E5484D; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="339" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="34" style="font-size:16px;font-weight:600">Finding 1: what <tspan class="mono" style="font-size:14px">rename</tspan> did with the old launcher when a file inside it was locked</text>
  <line x1="450" y1="52" x2="450" y2="318" stroke="#eaeef2"/>

  <!-- BEFORE -->
  <rect x="28" y="54" width="68" height="22" rx="11" fill="#E5484D"/><text x="62" y="69" text-anchor="middle" class="pill">BEFORE</text>

  <rect x="28" y="90" width="394" height="34" rx="6" class="box"/>
  <text x="44" y="112" class="mono">aidentity rename "Claude Work" Client</text>
  <line x1="225" y1="124" x2="225" y2="142" stroke="#6B7280" marker-end="url(#arrow)"/>

  <rect x="28" y="144" width="394" height="34" rx="6" class="box"/>
  <text x="44" y="166" class="mono">rm -rf "Claude Work.app"</text>
  <line x1="225" y1="178" x2="225" y2="196" stroke="#6B7280" marker-end="url(#arrow)"/>

  <rect x="28" y="198" width="394" height="62" rx="6" class="box"/>
  <text x="44" y="218" style="font-weight:600">Claude Work.app</text>
  <text x="60" y="236" class="mono"><tspan class="strike">Contents/Info.plist</tspan><tspan class="dim">  deleted</tspan></text>
  <text x="60" y="252" class="mono">Contents/MacOS/launcher<tspan class="dim">  locked, so it stays</tspan></text>
  <line x1="225" y1="260" x2="225" y2="278" stroke="#6B7280" marker-end="url(#arrow)"/>

  <rect x="28" y="280" width="394" height="38" rx="6" class="boxbad"/>
  <text x="44" y="297" class="bad" style="font-weight:600">A dead icon stays under the old name.</text>
  <text x="44" y="312" class="dim">aidentity rm refuses it: "not created by aidentity".</text>

  <!-- AFTER -->
  <rect x="478" y="54" width="60" height="22" rx="11" fill="#2FB344"/><text x="508" y="69" text-anchor="middle" class="pill">AFTER</text>

  <rect x="478" y="90" width="394" height="34" rx="6" class="box"/>
  <text x="494" y="112" class="mono">aidentity rename "Claude Work" Client</text>
  <line x1="675" y1="124" x2="675" y2="142" stroke="#6B7280" marker-end="url(#arrow)"/>

  <rect x="478" y="144" width="394" height="34" rx="6" class="box"/>
  <text x="494" y="166" class="mono">mv "Claude Work.app" .aidentity-rename.XXXX/</text>
  <line x1="675" y1="178" x2="675" y2="196" stroke="#6B7280" marker-end="url(#arrow)"/>

  <rect x="478" y="198" width="394" height="62" rx="6" class="box"/>
  <text x="494" y="218" style="font-weight:600">rm -rf the stage, as rm already does</text>
  <text x="510" y="236" class="dim">a locked file stays there, hidden; the message names it</text>
  <text x="510" y="252" class="dim">prune and the uninstaller already ignore that folder</text>
  <line x1="675" y1="260" x2="675" y2="278" stroke="#6B7280" marker-end="url(#arrow)"/>

  <rect x="478" y="280" width="394" height="38" rx="6" class="boxgood"/>
  <text x="494" y="297" class="good" style="font-weight:600">The old name is free. Every bundle is whole.</text>
  <text x="494" y="312" class="dim">Bundle itself locked? Left whole, with the old warning.</text>
</svg>
